</style></head><body><header><a href="./" class="brand"><b class="mark">✓</b><span>しごとAI診断<small>御殿場・裾野の事業者向け</small></span></a><span class="header-note">AI業務改善アドバイザー</span></header><main id="app"></main><footer>回答はサーバーに送信・保存しません。ページを閉じると回答は消えます。</footer><noscript>診断を利用するにはJavaScriptを有効にしてください。</noscript><script>'use strict';

const jobs=[
{id:'report',name:'報告書・議事録',desc:'日報、会議の記録、引き継ぎ',icon:'▤',auto:'メモから報告書・議事録の下書きを作る',human:'数値、固有名詞、決定事項の確認',trial:'過去の記録3件を匿名化し、同じ書式の下書きを作って、修正時間まで測る。',first:'よく使う報告書の書式を1つ選ぶ',needs:'書式1つと、個人名を除いた記録3件',rate:[.2,.4]},
{id:'mail',name:'メール・問い合わせ',desc:'返信文、よくある質問、連絡',icon:'✉',auto:'よくある質問の分類と返信の下書き',human:'送信前の内容確認、例外やクレーム対応',trial:'よくある問い合わせ5件と承認済みの回答を用意し、返信の下書きを試す。',first:'繰り返し届く質問を5つ集める',needs:'匿名化した質問5件と回答例',rate:[.2,.4]},
{id:'entry',name:'入力・転記・集計',desc:'紙やPDFから表へ、定期集計',icon:'⌗',auto:'書類の読み取りと表への転記補助',human:'読み取り結果と元資料の照合',trial:'同じ書式の書類5枚で、読み取り・修正を含む時間と間違いの数を比較する。',first:'転記が多い書類を1種類選ぶ',needs:'匿名化した書類5枚と転記先の列名',rate:[.15,.35]},

{id:'manual',name:'情報探し・マニュアル',desc:'社内ルール、手順、よくある質問',icon:'⌕',auto:'承認済み資料から回答候補と参照箇所を探す',human:'参照元の確認、安全や判断が必要な回答',trial:'最新の手順書1つと質問5件で、参照箇所を示せるかを確かめる。',first:'問い合わせの多い手順書を1つ選ぶ',needs:'最新の手順書と質問5件',rate:[.15,.3]},

];
const sectorExample={'製造業':'製造日報・検査記録・作業手順書など','建設・設備工事':'作業日報・現場報告・安全書類の整理など','小売・飲食':'売上集計・お客様への返信・販促投稿など','宿泊・観光':'予約の問い合わせ・口コミ返信・案内文など','介護・福祉':'会議記録・社内の手順確認・お知らせなど','その他サービス':'お客様への返信・提案資料・社内の情報整理など'};
let state={step:0,company:'',sector:'',size:'',selected:[],details:{},ready:'',goal:''};
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function choice(field,values){return `<div class="choices">${values.map(v=>`<label class="choice ${state[field]===v?'selected':''}"><input type="radio" name="${field}" value="${esc(v)}" ${state[field]===v?'checked':''}><span>${esc(v)}</span><b aria-hidden="true">${state[field]===v?'✓':'○'}</b></label>`).join('')}</div>`;}
function progress(){return `<nav class="steps" aria-label="診断の進行">${['会社のこと','困っている業務','作業のくわしさ','改善の方向'].map((x,i)=>`<span class="${state.step===i?'current':state.step>i?'done':''}" ${state.step===i?'aria-current="step"':''}><b>${state.step>i?'✓':i+1}</b>${x}</span>`).join('')}</nav><div class="track"><i style="width:${(state.step+1)*25}%"></i></div>`;}
function layout(body){return `${progress()}<div class="workspace"><aside><p class="eyebrow">BUSINESS CHECKUP</p><h1>仕事の「手間」を、<br>改善のきっかけに。</h1><p>いつもの業務について教えてください。<br>AIで助けられる部分を一緒に探します。</p><div class="aside-note"><b>まず1つ、選ぶだけ</b><span>会社名の入力は任意です。<br>わからない項目は、そのままで大丈夫。</span></div><div class="result-preview"><span>診断でわかること</span><p>01　優先して見直したい業務</p><p>02　AIに渡す指示文</p><p>03　今日10分で試すこと</p></div></aside><section class="panel" aria-labelledby="question-title">${body}<p id="error" class="error" role="alert"></p><div class="actions">${state.step?'<button class="secondary" data-action="back">戻る</button>':'<span class="meta">入力・選択はいつでも戻って変更できます</span>'}<button class="primary" data-action="next">${state.step===3?'診断結果を見る':'次へ'} <span>→</span></button></div></section></div>`;}
function render(){if(state.step===4){renderResult();return;}let b='';
if(state.step===0)b=`<p class="eyebrow">STEP 01 / 04</p><h2 id="question-title" tabindex="-1">まずは、会社のことを。</h2><p class="muted">業種に合わせた改善例をご案内します。</p><label class="field-label" for="company">会社名・屋号 <span>任意</span></label><input id="company" maxlength="80" placeholder="例）〇〇製作所" value="${esc(state.company)}"><fieldset><legend>業種 <em>1つ選択</em></legend>${choice('sector',sectors)}</fieldset><details class="optional-fields"><summary>従業員数を追加する（任意）</summary><fieldset><legend>従業員数</legend>${choice('size',['1〜5人','6〜20人','21〜50人','51人以上'])}</fieldset></details>`;
if(state.step===1)b=`<p class="eyebrow">STEP 02 / 04</p><h2 id="question-title" tabindex="-1">時間がかかっているのは？</h2><p class="muted">まずは1つでOK。気になるものは3つまで選べます。<br>${sectorExample[state.sector]}が対象です。</p><div class="job-list">${jobs.map(j=>`<label class="job ${state.selected.includes(j.id)?'selected':''}"><input type="checkbox" name="job" value="${j.id}" ${state.selected.includes(j.id)?'checked':''}><span class="job-icon">${j.icon}</span><span><strong>${j.name}</strong><small>${j.desc}</small></span><b>${state.selected.includes(j.id)?'✓':'＋'}</b></label>`).join('')}</div><p class="selection-count" role="status">${state.selected.length} / 3 選択中</p>`;
if(state.step===2){state.selected.forEach(id=>{state.details[id]??={};for(const k of ['freq','time'])state.details[id][k]??='0';for(const k of ['pattern','sensitive'])state.details[id][k]??='わからない';});}if(state.step===2)b=`<p class="eyebrow">STEP 03 / 04</p><h2 id="question-title" tabindex="-1">わかる範囲だけで大丈夫。</h2><p class="muted">この画面はそのまま「次へ」でも診断できます。<br>時間を選ぶと削減の目安も出せます。重複する時間は除いてください。</p>${state.selected.map(id=>{let j=jobs.find(j=>j.id===id),d=state.details[id]||{};return `<div class="detail-card"><h3>${j.name}</h3><div class="two-col"><label>頻度<select data-id="${id}" data-key="freq"><option value="">選んでください</option>${[['20','ほぼ毎日（月20日）'],['8','週2回くらい（月8回）'],['4','週1回くらい（月4回）'],['1','月1回くらい'],['0','わからない']].map(([v,t])=>`<option value="${v}" ${d.freq===v?'selected':''}>${t}</option>`).join('')}</select></label><label>1回あたりの合計時間<select data-id="${id}" data-key="time"><option value="">選んでください</option>${[['15','15分くらい'],['30','30分くらい'],['60','1時間くらい'],['120','2時間くらい'],['0','わからない']].map(([v,t])=>`<option value="${v}" ${d.time===v?'selected':''}>${t}</option>`).join('')}</select></label></div><label>作業の進め方<select data-id="${id}" data-key="pattern"><option value="">選んでください</option>${['同じ型の繰り返しが多い','毎回、判断や例外が多い','わからない'].map(t=>`<option ${d.pattern===t?'selected':''}>${t}</option>`).join('')}</select></label><label>扱う情報<select data-id="${id}" data-key="sensitive"><option value="">選んでください</option>${['公開してよい情報が中心','顧客・社員情報や社外秘を含む','わからない'].map(t=>`<option ${d.sensitive===t?'selected':''}>${t}</option>`).join('')}</select></label></div>`}).join('')}`;
if(state.step===3)b=`<p class="eyebrow">STEP 04 / 04</p><h2 id="question-title" tabindex="-1">どんな改善から始めたいですか？</h2><p class="muted">今の環境と、大切にしたいことを教えてください。</p><fieldset><legend>資料や記録は、主にどこにありますか？</legend>${choice('ready',['パソコンの文書・表計算','紙・手書きが中心','紙とデータが混在','わからない'])}</fieldset><fieldset><legend>いちばん優先したいことは？</legend>${choice('goal',['作業時間を減らしたい','ミス・確認漏れを減らしたい','担当者しかわからない状態を減らしたい','発信・集客に手を回したい'])}</fieldset><div class="callout">結果には、すぐ試せることと、先に整理しておきたいことを分けて表示します。</div>`;

function validate(){if(state.step===0)return state.sector?'':'業種を選んでください。';if(state.step===1)return state.selected.length?'':'改善したい業務を1つ以上選んでください。';if(state.step===2)return state.selected.every(id=>['freq','time','pattern','sensitive'].every(k=>state.details[id]?.[k]!==undefined&&state.details[id][k]!==''))?'':'各業務の4項目を選んでください。不明な項目は「わからない」を選べます。';return state.ready&&state.goal?'':'資料の状態と、優先したいことを選んでください。';}
function move(n){state.step=n;render();window.scrollTo({top:0,behavior:'instant'});document.querySelector('#question-title')?.focus({preventScroll:true});}
function bind(){document.querySelector('#company')?.addEventListener('input',e=>state.company=e.target.value);document.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{state[e.target.name]=e.target.value;document.querySelectorAll(`input[name="${e.target.name}"]`).forEach(x=>{x.closest('label').classList.toggle('selected',x.checked);x.closest('label').querySelector('b').textContent=x.checked?'✓':'○';});}));document.querySelectorAll('input[name=job]').forEach(el=>el.addEventListener('change',e=>{let id=e.target.value;if(e.target.checked&&state.selected.length===3){e.target.checked=false;document.querySelector('#error').textContent='選べるのは3つまでです。選択済みの業務を外すと変更できます。';return;}state.selected=e.target.checked?[...state.selected,id]:state.selected.filter(x=>x!==id);render();}));document.querySelectorAll('select').forEach(el=>el.addEventListener('change',e=>{const {id,key}=e.target.dataset;state.details[id]??={};state.details[id][key]=e.target.value;}));document.querySelector('[data-action=back]')?.addEventListener('click',()=>move(state.step-1));document.querySelector('[data-action=next]')?.addEventListener('click',()=>{let error=validate();if(error){document.querySelector('#error').textContent=error;return;}move(state.step+1);});}
function diagnose(s){return s.selected.map(id=>{const j=jobs.find(x=>x.id===id),d=s.details[id];const hours=Number(d.freq)*Number(d.time)/60;const regular=d.pattern==='同じ型の繰り返しが多い';const confidential=d.sensitive!=='公開してよい情報が中心';const paper=s.ready==='紙・手書きが中心';const fit=regular&&!confidential&&!paper;let score=hours+ (regular?10:0)+(fit?8:0);if(s.goal==='発信・集客に手を回したい'&&id==='sns')score+=30;if(s.goal==='担当者しかわからない状態を減らしたい'&&id==='manual')score+=30;if(s.goal==='ミス・確認漏れを減らしたい'&&['entry','report'].includes(id))score+=15;const factor=regular?1:.5;return {...j,...d,hours,confidential,paper,fit,score,low:Math.round(hours*j.rate[0]*factor*10)/10,high:Math.round(hours*j.rate[1]*factor*10)/10};}).sort((a,b)=>b.score-a.score);}
const recipes={
report:{before:'メモを見返して、文章にまとめている',after:'箇条書きをAIに渡す → 下書きを確認 → いつもの書式へ',material:'個人名や社外秘を除いた、短い作業メモ1件',sample:'作業：備品の点検／結果：異常なし／次回：金曜日に再点検',instruction:'次のメモを「実施内容・結果・次の対応」の3項目に整理してください。書かれていない事実は補わず、不明な点は「要確認」としてください。短い業務報告の下書きにしてください。',check:'事実・日時・数値を元のメモと照合する'},
mail:{before:'同じような返信を、毎回ゼロから書いている',after:'問い合わせ＋回答の要点 → AIが下書き → 人が確認して送信',material:'よくある質問1件と、会社として回答してよい内容',sample:'質問：営業時間を知りたい／承認済みの回答：平日9時〜17時、土日休み',instruction:'次の質問に対する丁寧で簡潔な返信文を作ってください。承認済みの回答だけを使い、料金・納期・約束を追加しないでください。不明点は質問として残してください。',check:'案内内容と宛先を確認し、送信は人が行う'},
entry:{before:'書類を見ながら、表へ一項目ずつ入力している',after:'同じ型のデータ → AIが表の下書き → 原本と全件照合',material:'個人情報を除いた短いデータ3行。最初は文字データでOK',sample:'4/1 ボルト 10個／4/2 ナット 20個／4/3 ワッシャー 5個',instruction:'次のデータを「日付・品名・数量・単位」の表に整理してください。元データにない値は推測せず「要確認」としてください。変換後に確認が必要な箇所を列挙してください。',check:'3行すべての数量・単位を照合。集計は表計算で行う'},

sns:{before:'何を書くか迷って、投稿が後回しになっている',after:'伝えたい事実3つ → AIが投稿案 → 事実・表現を確認して公開',material:'公開してよい商品・サービスの特徴を3つ',sample:'地域：御殿場／サービス：業務改善の相談／特徴：まず小さな作業から見直す',instruction:'次の事実だけを使って、読みやすいSNS投稿文を120〜180文字で2案作ってください。価格、実績、口コミ、効果の数字は捏造しないでください。親しみやすく、誇張を避けてください。',check:'事実・画像の利用可否・誇大な表現がないか確認する'}
};
function quickPlan(j){const r=recipes[j.id];return `<section class="quick-plan"><span class="badge">今日の最初の一歩 · 10分を目安に</span><h2>${j.name}の「下書き」から試しましょう。</h2><div class="before-after"><div><small>いま</small><p>${r.before}</p></div><div><small>こう変える</small><p>${r.after}</p></div></div><ol class="quick-steps"><li><b>1件だけ用意する</b><p>${r.material}。用意が難しければ、下の架空サンプルで試せます。</p></li><li><b>指示文をコピーして、AIチャットへ</b><p>会社で利用を認められたAIチャットに貼り付け、最後のサンプルを置き換えます。許可が不明なら架空サンプルのまま試してください。</p></li><li><b>下書きを確認する</b><p>${r.check}。まずは1件だけ。今までより楽かどうかを比べましょう。</p></li></ol><div class="prompt-box"><div><h3>そのまま使える指示文</h3><button id="copy-prompt" class="primary no-print">指示文をコピー</button></div><pre id="prompt-text">${esc(r.instruction)}

【入力：以下は架空サンプルです】
${esc(r.sample)}</pre><p id="copy-status" role="status" class="muted"></p></div><div class="success-check"><b>「使えそう」の目安</b><p>内容が正しく、確認・修正込みで以前より短く終わること。直す手間が多ければ、入力項目を絞るか、元の書式を追加してもう1件だけ試します。</p></div>${j.confidential?'<p class="safety-note">顧客情報・社員情報・社外秘は、入力が認められた環境を確認するまで使わないでください。</p>':''}</section>`;}
function renderResult(){const ranked=diagnose(state),first=ranked[0],low=ranked.reduce((s,x)=>s+x.low,0),high=ranked.reduce((s,x)=>s+x.high,0),unknown=ranked.filter(x=>!x.hours).length;const date=new Date().toLocaleDateString('ja-JP');app.innerHTML=`<div class="results"><div class="result-heading"><div><p class="eyebrow">YOUR NEXT STEP</p><h1 id="question-title" tabindex="-1">まずは「${first.name}」から。</h1><p>${esc(state.company||'会社名未入力')} · ${esc(state.sector)} · ${esc(state.size||'人数未入力')} <span class="date">${date}</span></p></div><div class="no-print result-actions"><button class="secondary" id="edit">回答を見直す</button><button class="primary" id="print">診断シートを保存・印刷</button></div></div>${quickPlan(first)}<details class="more-results"><summary>ほかの改善候補・削減の目安を見る</summary><div class="summary-grid"><div class="summary-main"><span class="badge">最初に試したいこと</span><h2>${first.first}</h2><p>${first.trial}</p><div class="reason">選定理由：${state.goal==='作業時間を減らしたい'?'作業量と、定型化のしやすさを重視。':esc(state.goal)+'というご希望を優先。'}${first.fit?'定型作業が多く、公開できる情報で小さく試しやすい候補です。':'導入前の準備も含めて取り組む候補です。'}</div></div><div class="estimate"><span>月の削減時間 · 仮試算</span><strong>${high?`${low.toFixed(1)}<small>〜</small>${high.toFixed(1)}`:'未算出'}${high?'<small>時間</small>':''}</strong><p>${unknown?'時間がわかる業務のみを集計。':''}確認・修正を含む実測で検証します。<br>削減を保証する数値ではありません。</p><details><summary>試算の根拠を見る</summary><p>月の頻度 × 1回の合計時間 × 仮の削減率。削減率は設計上の仮定で、調査統計ではありません。</p>${ranked.map(j=>`<p>${j.name}：${j.hours?`${j.hours.toFixed(1)}時間/月 × ${Math.round(j.rate[0]*(j.pattern==='同じ型の繰り返しが多い'?1:.5)*100)}〜${Math.round(j.rate[1]*(j.pattern==='同じ型の繰り返しが多い'?1:.5)*100)}%`:'時間不明のため対象外'}</p>`).join('')}</details></div></div><div class="section-label"><h2>改善候補と、任せる範囲</h2><span>選んだ ${ranked.length} 業務を比較</span></div><div class="recommendations">${ranked.map((j,i)=>`<article class="recommendation"><div class="rec-title"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><h3>${j.name}</h3><span class="pill ${j.fit?'':'amber'}">${j.fit?'小さく試しやすい':'準備・確認から始める'}</span></div><span class="hours">${j.hours?`月 ${j.low.toFixed(1)}〜${j.high.toFixed(1)} 時間`:'時間の計測から'}<small>${j.hours?'削減の仮試算':''}</small></span></div><div class="roles"><div><span>AIで補助できること</span><p>${j.auto}</p></div><div><span>人が担当すること</span><p>${j.human}</p></div></div><div class="preparation"><b>先に確認</b><p>${j.confidential?'利用を承認された環境と入力可能な情報を確認。最初は架空・匿名化した情報で試します。':'公開してよい情報と、完成形の見本を用意します。'}${j.paper?'紙の読み取り精度とデータ化の手間を先に確認します。':''}${j.pattern!=='同じ型の繰り返しが多い'?'例外の少ない一部分に絞り、最終判断は人が行います。':''}${state.sector==='介護・福祉'?'ケアの判断や個人の状態評価は対象にせず、記録・文章の補助に限定します。':''}</p></div></article>`).join('')}</div></details><section class="week-plan"><p class="eyebrow">ONE WEEK PLAN</p><h2>最初の1週間は、この3ステップ。</h2><div class="plan-grid"><div><b>01 / 準備する</b><p>${first.needs}を用意。今の作業時間と確認箇所を記録します。</p></div><div><b>02 / 小さく試す</b><p>${first.trial}</p></div><div><b>03 / 続けるか判断する</b><p>修正込みの所要時間と間違いを比較。効果があり、確認の負担が増えない範囲で続けます。</p></div></div></section><details class="answers"><summary>回答内容を確認</summary><p>資料の状態：${esc(state.ready)}<br>優先したいこと：${esc(state.goal)}</p>${ranked.map(j=>`<p><b>${j.name}</b>：月${j.freq==='0'?'不明':j.freq}回 / 1回${j.time==='0'?'不明':j.time}分 / ${j.pattern} / ${j.sensitive}</p>`).join('')}</details><p class="disclaimer">この診断は回答に基づく簡易的な改善候補の整理です。生成AIが個別企業を調査・評価した結果ではありません。導入費用、ツールの契約条件、情報の取り扱いは実際の業務を確認して検討します。安全確認や最終承認をAIだけに任せることは想定していません。</p><div class="report-footer"><b>AI業務改善アドバイザー · 山門 大騎</b><span>御殿場・裾野 ／ t.yamakado.ai.partner@gmail.com</span></div><div class="no-print bottom-actions"><span>PDFは印刷画面で「PDFに保存」を選んでください。</span><button class="secondary" id="reset">次の会社を診断する</button></div></div>`;document.querySelector('#copy-prompt').onclick=async()=>{const text=document.querySelector('#prompt-text').textContent;try{await navigator.clipboard.writeText(text);document.querySelector('#copy-status').textContent='コピーしました。会社で利用を認められたAIチャットに貼り付けてください。';}catch{document.querySelector('#copy-status').textContent='自動コピーできませんでした。下の指示文を選択してコピーしてください。';}};document.querySelector('#edit').onclick=()=>move(0);document.querySelector('#print').onclick=()=>{const d=document.querySelector('.more-results');const was=d.open;d.open=true;window.addEventListener('afterprint',()=>{d.open=was;},{once:true});window.print();};document.querySelector('#reset').onclick=()=>{if(confirm('回答を消去して、新しい診断を始めますか？')){state={step:0,company:'',sector:'',size:'',selected:[],details:{},ready:'',goal:''};move(0);}};}

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_diagnosis',description:'現在入力されている回答と、完了済みの診断結果を読み取る。回答の変更や送信は行わない。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('引数は空のオブジェクトにしてください。');return {step:state.step+1,answers:JSON.parse(JSON.stringify(state)),result:state.step===4?diagnose(state):null};}})).catch(()=>{});}catch{}}
