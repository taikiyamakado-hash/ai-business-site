<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AI業務改善と販促制作をまとめて相談できるイメージ</title>
  <desc id="desc">相談担当者、AIダッシュボード、販促制作物が並ぶ法人向けイラスト</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2357b8"/>
      <stop offset="1" stop-color="#4f7ee8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#172033" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1040" cy="135" r="116" fill="#ffe5cf" opacity="0.85"/>
  <circle cx="170" cy="760" r="150" fill="#dbeafe" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect x="96" y="110" width="1008" height="660" rx="34" fill="#ffffff"/>
  </g>

  <g transform="translate(150 160)">
    <rect x="0" y="0" width="900" height="88" rx="18" fill="#153d8a"/>
    <circle cx="40" cy="44" r="12" fill="#f47a2a"/>
    <circle cx="78" cy="44" r="12" fill="#ffe66d"/>
    <circle cx="116" cy="44" r="12" fill="#7dd3fc"/>
    <text x="165" y="55" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">AI業務改善プラン</text>
  </g>

  <g transform="translate(150 286)">
    <rect x="0" y="0" width="362" height="378" rx="26" fill="#f8fafc" stroke="#d9e2f2" stroke-width="3"/>
    <text x="34" y="58" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#172033">相談内容</text>
    <g font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#334155">
      <rect x="34" y="96" width="294" height="58" rx="14" fill="#ffffff" stroke="#d9e2f2"/>
      <text x="60" y="133">事務作業の時短</text>
      <rect x="34" y="176" width="294" height="58" rx="14" fill="#ffffff" stroke="#d9e2f2"/>
      <text x="60" y="213">SNS投稿の作成</text>
      <rect x="34" y="256" width="294" height="58" rx="14" fill="#ffffff" stroke="#d9e2f2"/>
      <text x="60" y="293">チラシ・LP改善</text>
    </g>
  </g>

  <g transform="translate(568 286)">
    <rect x="0" y="0" width="482" height="378" rx="26" fill="#ffffff" stroke="#d9e2f2" stroke-width="3"/>
    <text x="36" y="58" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#172033">まとめて改善</text>
    <g transform="translate(40 98)">
      <rect x="0" y="0" width="186" height="226" rx="22" fill="url(#blue)"/>
      <text x="26" y="54" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#ffffff">AI</text>
      <path d="M30 112h126M30 154h92M30 196h138" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
      <circle cx="142" cy="54" r="24" fill="#ffe66d"/>
    </g>
    <g transform="translate(258 98)">
      <rect x="0" y="0" width="178" height="226" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
      <rect x="24" y="28" width="130" height="42" rx="10" fill="#f47a2a"/>
      <text x="48" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">販促</text>
      <path d="M28 108h122M28 146h92M28 184h116" stroke="#d95f14" stroke-width="13" stroke-linecap="round" opacity="0.55"/>
    </g>
    <path d="M232 205h42" stroke="#f47a2a" stroke-width="12" stroke-linecap="round"/>
    <path d="M262 181l30 24-30 24" fill="none" stroke="#f47a2a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(234 708)">
    <rect x="0" y="0" width="732" height="86" rx="43" fill="#2357b8"/>
    <text x="366" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">AI導入から制作・集客まで一括サポート</text>
  </g>
</svg>
